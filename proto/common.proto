syntax = "proto3";

package agentcomm.common;

option go_package = "agentcomm/internal/rpc/pb;pb";

// 通用响应状态
message Status {
  int32 code = 1;
  string message = 2;
  string details = 3;
}

// Agent / 服务信息
message ServiceInfo {
  string service_name = 1;
  string version = 2;
  string host = 3;
  int32 port = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
}

message HealthCheckRequest { string service = 1; }
message HealthCheckResponse {
  enum ServingStatus { UNKNOWN = 0; SERVING = 1; NOT_SERVING = 2; }
  ServingStatus status = 1;
}
